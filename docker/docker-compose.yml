services:
  postgres:
    image: postgres:16-alpine
    container_name: acedesoft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acedesoft
      POSTGRES_PASSWORD: acedesoft
      POSTGRES_DB: acedesoft_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
